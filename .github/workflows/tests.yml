name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

# Permissions the deploy job needs to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Xvfb (virtual display for the browser)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # Xvfb gives Chrome a screen on the headless runner.
        # failure.ignore=true so we still publish the report when a test fails.
        run: xvfb-run -a mvn -B test -Dmaven.test.failure.ignore=true

      - name: Generate Allure report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:report

      - name: Upload the report as a Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy-report:
    needs: ui-tests
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
