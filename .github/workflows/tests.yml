name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Xvfb (virtual display for the browser)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # Xvfb gives Chrome a screen on the headless runner.
        # failure.ignore=true so we still publish the report when a test fails.
        run: xvfb-run -a mvn -B test -Dmaven.test.failure.ignore=true

      - name: Generate Allure report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
