# Which browser to launch: chrome | firefox
browser=chrome

# How long to keep retrying an action before giving up (seconds)
timeout=5

# How often to re-check while waiting (milliseconds)
pollingMillis=250

# Open the Allure report in the browser automatically after the run
autoServeReport=true

# Base URL per application under test (change env here in one place)
sauceDemoBaseURL=https://www.saucedemo.com
duckDuckGoBaseURL=https://duckduckgo.com
herokuBaseURL=http://the-internet.herokuapp.com
